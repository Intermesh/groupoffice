# Apache vhost for both mp-e2e instances. Plain GO on :80 — no second origin is
# needed here, unlike the sf/mcp harness.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # The marketplace client sends its bearer token in the Authorization
        # header. mod_php gets it for free, but this image can be built on
        # FastCGI too, where Apache drops the header unless it is re-exported —
        # the very deployment the vendor's apiCustomer() keeps its
        # REDIRECT_HTTP_AUTHORIZATION fallback for. Directory context: Apache
        # refuses CGIPassAuth in <VirtualHost>.
        CGIPassAuth On
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
